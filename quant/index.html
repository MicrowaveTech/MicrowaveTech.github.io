<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>日度策略看板</title>
  <link rel="stylesheet" href="./styles.css">
  <script defer src="./vendor/lucide.min.js"></script>
  <script defer src="./config.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="./"><span class="brand-mark"><i data-lucide="chart-no-axes-combined"></i></span><span>日度策略看板<small>QUANT DAILY</small></span></a>
      <div class="nav-label">工作空间</div>
      <nav aria-label="主要导航">
        <button class="nav-item active" data-view="overview"><i data-lucide="layout-dashboard"></i><span>总览</span></button>
        <button class="nav-item" data-view="morning"><i data-lucide="sunrise"></i><span>盘前</span><span class="nav-dot" id="morning-dot"></span></button>
        <button class="nav-item" data-view="trades"><i data-lucide="arrow-left-right"></i><span>买卖记录</span><span class="nav-count" id="trade-count">0</span></button>
        <button class="nav-item" data-view="close"><i data-lucide="chart-column"></i><span>收盘总结</span></button>
        <button class="nav-item" data-view="logs"><i data-lucide="logs"></i><span>原始日志</span></button>
      </nav>
      <div class="sidebar-bottom">
        <label class="demo-switch"><span><i data-lucide="flask-conical"></i>演示数据</span><input id="demo-toggle" type="checkbox" role="switch" aria-label="演示数据"></label>
        <div class="local-status"><span class="status-dot"></span><span>本地工作空间<small id="source-count">等待数据</small></span><i data-lucide="hard-drive"></i></div>
      </div>
    </aside>
    <main>
      <header class="topbar"><div class="breadcrumb">工作空间 <span>/</span> <strong id="breadcrumb-view">总览</strong></div><div class="topbar-actions"><span class="auto-status"><span class="status-dot"></span>每小时更新</span><button class="icon-button" id="import-button" title="导入日志" aria-label="导入日志"><i data-lucide="upload"></i></button><input type="file" id="file-input" accept=".txt,.log,.csv,text/plain" hidden><button class="icon-button" id="refresh-button" title="刷新数据" aria-label="刷新数据"><i data-lucide="refresh-cw"></i></button></div></header>
      <div class="content">
        <div id="demo-banner" class="notice demo-notice" hidden><i data-lucide="flask-conical"></i><span>演示模式 · 以下均为虚构数据，不代表实际账户或交易。</span></div>
        <div id="error-banner" class="notice error-notice" role="alert" hidden></div>
        <section class="page-heading"><div><div class="eyebrow">DAILY MONITOR</div><h1 id="page-title">当日运行总览</h1><p class="subtitle"><span id="day-caption">等待日志数据</span><span class="subtitle-divider">·</span><span id="updated-at">尚未更新</span></p></div><div class="date-controls"><button id="prev-day" class="icon-button" title="前一个交易日" aria-label="前一个交易日"><i data-lucide="chevron-left"></i></button><label class="date-selector"><i data-lucide="calendar-days"></i><select id="date-select" aria-label="选择日期"><option value="">暂无日期</option></select></label><button id="next-day" class="icon-button" title="后一个交易日" aria-label="后一个交易日"><i data-lucide="chevron-right"></i></button></div></section>
        <div id="loading" class="loading-state" role="status" hidden>正在载入数据…</div>
        <div id="workspace"></div>
        <footer><span>日度策略看板</span><span id="footer-status">本地日志 · 每 60 分钟更新</span></footer>
      </div>
    </main>
  </div>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
